version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: faithtech-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: faithtech_secure_password
      POSTGRES_DB: FaithTechDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d FaithTechDB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: faithtech-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: faithtech-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BASE_URL: http://localhost:3000
      DATABASE_URL: "postgresql://postgres:faithtech_secure_password@postgres:5432/FaithTechDB?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_ISSUER: faithtech-astrology-api
      JWT_AUDIENCE: faithtech-astrology-mobile
      JWT_ACCESS_SECRET: "c8f8b3c96d5e4b789123456789abcdef0123456789abcdef0123456789abcdef"
      JWT_ACCESS_TOKEN_TTL: "15m"
      REFRESH_TOKEN_TTL_DAYS: "30"
      OTP_TTL_SECONDS: "300"
      OTP_MAX_ATTEMPTS: "5"
      OTP_RESEND_COOLDOWN_SECONDS: "60"
      OTP_HMAC_SECRET: "e7d3a2b1f4c6e80123456789abcdef0123456789abcdef0123456789abcdef01"
      SMS_PROVIDER: "mock"
      LOG_LEVEL: "info"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
